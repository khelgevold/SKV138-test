<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKV138 – Neon TEST</title>
<meta name="theme-color" content="#101f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#193328;background:#f3f6f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,440px);padding:30px;background:#fff;border:1px solid #d9e5dd;border-radius:16px;box-shadow:0 12px 35px #102a1b12}
h1{margin:0 0 8px}p{line-height:1.5;color:#50695a}label{display:block;margin:18px 0 6px;font-weight:600}
input{width:100%;padding:13px;font:inherit;border:1px solid #a7b9ae;border-radius:9px}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#245c43;color:white;font:inherit;font-weight:600}
button:disabled{opacity:.6}.secondary{background:transparent;color:#245c43;border:1px solid #9bb8a5;margin-top:8px}[hidden]{display:none!important}#status[data-error=true]{color:#a12a2a}#status{min-height:1.5em}
small{color:#526b5c}#authorized{display:none}body.app-ready{display:block;padding:0;background:#101f1a}body.app-ready>main{display:none}#app-frame{display:none;width:100%;height:100dvh;border:0}body.app-ready #app-frame{display:block}#save-alert{display:none;position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff1dc;color:#633c00;padding:12px 16px;text-align:center}body.save-blocked #save-alert{display:block}body.save-blocked #app-frame{pointer-events:none;filter:grayscale(.55)}body.restoring-session>main{visibility:hidden}body.restoring-session:not(.app-ready)::before{content:'Gjenoppretter innlogging …';position:fixed;inset:0;display:grid;place-items:center;color:#245c43;font-weight:600}
</style></head><body><main>
<h1>SKV138</h1><p>Logg inn for å åpne hytteappen.</p>
<form id="login"><label for="email">E-post</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Passord</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Logg inn</button></form>
<p id="status" role="status" aria-live="polite"></p>
<button id="show-register" type="button" class="secondary">Opprett bruker</button>
<button id="show-reset" type="button" class="secondary">Glemt passord?</button>
<form id="register-form" hidden><label for="register-name">Navn</label><input id="register-name" autocomplete="name" required><label for="register-email">E-post</label><input id="register-email" type="email" autocomplete="email" required><label for="register-password">Passord (minst 8 tegn)</label><input id="register-password" type="password" autocomplete="new-password" minlength="8" required><button id="register-submit" type="submit">Opprett bruker</button><p id="register-status" role="status" aria-live="polite"></p></form>
<form id="reset-form" hidden><label for="reset-email">E-post for tilbakestilling</label><input id="reset-email" type="email" autocomplete="email" required><button id="reset-submit" type="submit">Be om ny lenke</button><p id="reset-status" role="status" aria-live="polite"></p></form>
<form id="new-password-form" hidden><label for="new-password">Nytt passord</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Gjenta passord</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button id="new-password-submit" type="submit">Oppdater passord</button><p id="new-password-status" role="status" aria-live="polite"></p></form>
<section id="authorized"><h2>Tilgang bekreftet</h2><p>Backend har bekreftet at kontoen har tilgang. Hytteappen er ikke koblet til dette TEST-skallet ennå.</p></section>
<small>Tilgang til SKV138 må godkjennes separat.</small>
</main><div id="save-alert" role="alert"><span id="save-message">Lagring er stoppet.</span> <button id="download-recovery" type="button">Last ned ulagrede data</button></div><iframe id="app-frame" title="SKV138 hytteapp" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"></iframe>
<script type="module">
import { startConfiguredSkv138TestLogin, createNeonTestSession, mountPasswordResetForm, mountNewPasswordForm, readResetToken, clearResetTokenFromUrl, createV1623StateBridge } from "./neon-test-entry.js";
const status=document.querySelector("#status");
try {
  const neonLogin=createNeonTestSession();
  const {login}=neonLogin;
  const token=readResetToken(window.location.href,window.location.origin);
  if(token){
    document.querySelector("#login").hidden=true;
    document.querySelector("#show-reset").hidden=true;
    document.querySelector("#show-register").hidden=true;
    document.querySelector("#new-password-form").hidden=false;
    clearResetTokenFromUrl(window.history,window.location.href);
    mountNewPasswordForm({document,login,token});
  }else{
    mountPasswordResetForm({document,login,redirectTo:window.location.origin + window.location.pathname});
    document.querySelector("#show-register").addEventListener("click",()=>{
      document.querySelector("#login").hidden=true;
      document.querySelector("#show-reset").hidden=true;
      document.querySelector("#show-register").hidden=true;
      document.querySelector("#register-form").hidden=false;
    });
    document.querySelector("#register-form").addEventListener("submit",async event=>{
      event.preventDefault();
      const button=document.querySelector("#register-submit");
      const message=document.querySelector("#register-status");
      button.disabled=true;
      message.textContent="Oppretter TEST-bruker …";
      try {
        const result=await login.register(document.querySelector("#register-email").value,document.querySelector("#register-password").value,document.querySelector("#register-name").value);
        document.querySelector("#register-password").value="";
        if(result.ok){
          message.textContent="Bruker opprettet. Logg inn med e-post og passord. Tilgang til SKV138 må godkjennes separat.";
          document.querySelector("#login").hidden=false;
        }else message.textContent=result.message||"Registrering mislyktes.";
      }catch{message.textContent="Registrering kunne ikke fullføres."}
      finally{button.disabled=false;}
    });
    document.querySelector("#show-reset").addEventListener("click",()=>{
      document.querySelector("#login").hidden=true;
      document.querySelector("#show-reset").hidden=true;
      document.querySelector("#reset-form").hidden=false;
    });
  }
  if (!token) { document.body.classList.add('restoring-session'); const sessionStart = startConfiguredSkv138TestLogin({
    document,
    neonLogin,
    fetchImpl: (...args)=>fetch(...args),
    storage: window.localStorage,
    onAuthorized: async (payload, client) => {
      const bridge=createV1623StateBridge({
        client,
        onStatus: event => {
          if(event.type==="conflict"||event.type==="error") {
            document.body.classList.add("save-blocked");
            document.querySelector("#app-frame").inert=true;
            document.querySelector("#save-message").textContent=event.type==="conflict"
              ?"En annen lagring har endret dataene. Lagring er stoppet."
              :"Lagringen mislyktes. Endringer er ikke lagret.";
          }
        }
      });
      await bridge.initialize(payload);
      window.__SKV138_TEST_BRIDGE__=bridge;
      window.addEventListener("beforeunload", event => {
        const state=bridge.getStatus();
        if (state.dirty || state.blocked) { event.preventDefault(); event.returnValue=""; }
      });
      document.querySelector("#download-recovery").addEventListener("click",()=>{
        const data=bridge.getRecoveryData();
        if(!data)return;
        const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
        const a=document.createElement("a");
        a.href=url;a.download="skv138-test-ulagret.json";a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      });
      document.querySelector("#app-frame").src="./app.html";
      document.body.classList.add("app-ready");
      status.textContent="";
    }
  });
  sessionStart.restoring.finally(() => document.body.classList.remove('restoring-session'));
}
} catch {
  document.body.classList.remove('restoring-session');
  status.dataset.error="true";
  status.textContent="TEST-innlogging kunne ikke startes.";
}
</script></body></html>
